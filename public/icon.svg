<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fundo Apple Squircle com cantos suaves -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Anel de destaque esmeralda -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#glowRing)" stroke-width="6" opacity="0.4"/>
  
  <!-- Moeda central verde financeira -->
  <circle cx="256" cy="256" r="160" fill="url(#coinGrad)" filter="url(#dropShadow)" stroke="#6ee7b7" stroke-width="4"/>
  
  <!-- Cifrão ($) Clássico Imponente -->
  <text x="256" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="210" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#dropShadow)">$</text>
  
  <!-- Brilhos sutis -->
  <circle cx="360" cy="160" r="8" fill="#a7f3d0" opacity="0.8"/>
  <circle cx="160" cy="360" r="6" fill="#a7f3d0" opacity="0.6"/>
</svg>